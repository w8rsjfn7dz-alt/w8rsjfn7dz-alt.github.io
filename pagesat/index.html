<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d172b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Pagesat"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" sizes="180x180" href="pagesat-icon.svg"><title>Pagesat</title><style>*{box-sizing:border-box}body{margin:0;background:#08111f;color:#f2f5fc;font:16px -apple-system,BlinkMacSystemFont,sans-serif}.wrap{max-width:750px;margin:auto;padding:22px 16px 60px}h1{font-size:28px}h2{font-size:20px}.muted,.meta{color:#aabbd0}button,input,select{font:inherit}button{cursor:pointer;background:#233957;color:white;border:1px solid #405473;border-radius:12px;padding:11px 13px}button.primary{background:#377ef4;border-color:#377ef4}button.danger{color:#ffb6b6}.card,.item,dialog{background:#14253b;border:1px solid #2a415b;border-radius:17px}.card{padding:16px;margin:14px 0}.toolbar,.actions,.totals,.item,.right{display:flex;align-items:center;gap:10px}.toolbar,.actions{flex-wrap:wrap}.toolbar input{min-width:135px}.totals{align-items:stretch}.totals>div{flex:1;min-width:0}.sum{font-size:19px;font-weight:700;margin-top:7px}.item{padding:14px;margin-bottom:10px;justify-content:space-between}.item>div:nth-child(2){flex:1;min-width:0}.item input{width:23px;height:23px;accent-color:#4d91fd}.name{font-weight:650;overflow-wrap:anywhere}.paid{text-decoration:line-through;opacity:.7}.meta{font-size:13px;margin-top:5px}.right{flex-shrink:0}.right strong{font-size:15px}dialog{color:white;max-width:calc(100vw - 32px);width:440px;padding:20px}dialog::backdrop{background:#0009}label.field{display:block;margin:12px 0}label.field input,label.field select{display:block;width:100%;padding:12px;margin-top:6px;border:1px solid #506786;border-radius:10px;background:#08111f;color:white}.dialogActions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}small{color:#aabbd0}input[type=month]{color-scheme:dark;background:#172c46;color:white;border:1px solid #536784;padding:10px;border-radius:10px}@media(max-width:420px){.totals{flex-wrap:wrap}.totals>div{min-width:40%}.item{gap:7px}.right{gap:5px;flex-direction:column;align-items:end}} [hidden]{display:none!important}#summaryToggle{cursor:pointer}#listPanel{padding-top:16px}#details .card{margin:10px 0}#details h3{margin:0 0 8px;font-size:17px}</style></head><body><main class="wrap"><h1>💳 Shpenzimet e Mia</h1><p class="muted">Pagesat mujore • korona suedeze (kr)</p><section class="card"><div class="toolbar"><button id="prev">‹</button><strong id="monthTitle"></strong><button id="next">›</button><input id="chooseMonth" type="month" aria-label="Zgjidh muajin"><button id="todayBtn">Sot</button></div></section><button id="summaryToggle" class="card" style="width:100%;text-align:left;display:block"><small>Totali i muajit <span style="float:right">▾</span></small><div id="total" style="font-size:38px;font-weight:800;margin:8px 0"></div><small>Paguar: <span id="paid"></span> · Mbeten: <span id="remaining"></span></small><div style="margin-top:10px;color:#aabbd0">Prek për të parë pagesat sipas kategorive</div></button><div id="details" hidden><h2>Pagesat sipas kategorive <small id="count"></small></h2><div id="items"></div></div><section class="card"><button id="listToggle" class="primary" style="width:100%">☷ Lista e pagesave</button><div id="listPanel" hidden><p class="muted">Shto, ndrysho ose fshi pagesat e muajit të zgjedhur.</p><div class="actions"><button id="add" class="primary">+ Shto në listë</button><button id="copyPrevious">Kopjo muajin e kaluar</button></div><div id="listItems"></div></div></section><section class="card"><h2>Kopje rezervë</h2><p class="muted">Të dhënat ruhen në këtë pajisje. Shkarko rregullisht kopje rezervë, sidomos para ndërrimit të telefonit.</p><div class="actions"><button id="export">Shkarko kopjen</button><button id="import">Rikthe kopjen</button><input type="file" accept=".json,application/json" id="file" hidden></div></section></main><dialog id="editor"><form id="expenseForm"><h2 id="formTitle">Shto pagesë</h2><label class="field">Emri<input id="name" required maxlength="90"></label><label class="field">Shuma (kr)<input id="amount" type="number" min="0" max="100000000" step="0.01" required></label><label class="field">Kategoria<select id="category"><option>Shtëpia</option><option>Telefon & internet</option><option>Makina</option><option>Familja</option><option>Të tjera</option></select></label><label class="field">Përsëritja<select id="recurring"><option value="yes">Çdo muaj</option><option value="no">Vetëm këtë muaj</option></select></label><div class="dialogActions"><button class="danger" id="delete" type="button" hidden>Fshi</button><button id="cancel" type="button">Anulo</button><button class="primary" type="submit">Ruaj</button></div></form></dialog><script>
(()=>{'use strict';const KEY='iliri-shpenzimet-v1',defaults=[['Qeraja','Shtëpia'],['Dritat','Shtëpia'],['Interneti i shtëpisë','Telefon & internet'],['SIM kartë','Telefon & internet'],['iPhone i Oltës','Telefon & internet'],['Sigurimi i makinës','Makina'],['Makina','Makina'],['Sigurimi i shtëpisë','Shtëpia'],['Olta','Familja']], $=id=>document.getElementById(id),today=new Date();let y=today.getFullYear(),m=today.getMonth(),editing=null;const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36),key=()=>y+'-'+String(m+1).padStart(2,'0'),fmt=n=>new Intl.NumberFormat('sv-SE',{maximumFractionDigits:2}).format(n||0)+' kr',prev=k=>{let [a,b]=k.split('-').map(Number),d=new Date(a,b-2,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')},esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let db;try{db=JSON.parse(localStorage.getItem(KEY));if(!db||!Array.isArray(db.templates)||!db.months)throw Error()}catch{db={templates:defaults.map(([name,category])=>({id:uid(),name,category,amount:0,activeFrom:key()})),months:{}};save()}function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Ruajtja dështoi. Shiko hapësirën e telefonit.')}}function month(k){if(!db.months[k]){db.months[k]=db.templates.filter(t=>t.activeFrom<=k&&(!t.endAfter||t.endAfter>=k)).map(t=>({id:uid(),templateId:t.id,name:t.name,category:t.category,amount:t.amount,paid:false}));save()}return db.months[k]}function render(){let arr=month(key()),total=arr.reduce((s,a)=>s+Number(a.amount||0),0),paid=arr.reduce((s,a)=>s+(a.paid?Number(a.amount||0):0),0);$('monthTitle').textContent=new Intl.DateTimeFormat('sq-AL',{month:'long',year:'numeric'}).format(new Date(y,m,1));$('chooseMonth').value=key();$('total').textContent=fmt(total);$('paid').textContent=fmt(paid);$('remaining').textContent=fmt(total-paid);$('count').textContent='('+arr.length+')';let groups={};for(let a of arr)(groups[a.category||'Të tjera']??=[]).push(a);$('items').innerHTML=arr.length?Object.entries(groups).map(([c,items])=>'<section class="card"><h3>'+esc(c)+' <small>('+fmt(items.reduce((n,x)=>n+Number(x.amount||0),0))+')</small></h3>'+items.map(a=>'<article class="item"><input type="checkbox" data-check="'+esc(a.id)+'" '+(a.paid?'checked':'')+'><div><div class="name '+(a.paid?'paid':'')+'">'+esc(a.name)+'</div><div class="meta">'+(a.paid?'E paguar':'Në pritje')+'</div></div><div class="right"><strong>'+fmt(a.amount)+'</strong><button data-edit="'+esc(a.id)+'" aria-label="Ndrysho">✎</button></div></article>').join('')+'</section>').join(''):'<p class="muted">Nuk ka pagesa këtë muaj.</p>';$('listItems').innerHTML=arr.map(a=>'<article class="item"><div><div class="name">'+esc(a.name)+'</div><div class="meta">'+esc(a.category||'Të tjera')+' · '+fmt(a.amount)+'</div></div><button data-listedit="'+esc(a.id)+'">Ndrysho / Fshi</button></article>').join('')||'<p class="muted">Lista është bosh.</p>'} $('summaryToggle').onclick=()=>{$('details').hidden=!$('details').hidden};$('listToggle').onclick=()=>{$('listPanel').hidden=!$('listPanel').hidden};$('listItems').onclick=e=>{let b=e.target.closest('[data-listedit]');if(b){let a=month(key()).find(v=>v.id===b.dataset.listedit);if(a)edit(a)}};function shift(n){const d=new Date(y,m+n,1);y=d.getFullYear();m=d.getMonth();render()}$('prev').onclick=()=>shift(-1);$('next').onclick=()=>shift(1);$('todayBtn').onclick=()=>{y=today.getFullYear();m=today.getMonth();render()};$('chooseMonth').onchange=()=>{let k=$('chooseMonth').value;if(/^\d{4}-(0[1-9]|1[0-2])$/.test(k)){[y,m]=k.split('-').map(Number);m--;render()}};function edit(a){editing=a?.id||null;$('formTitle').textContent=a?'Ndrysho pagesën':'Shto pagesë';$('name').value=a?.name||'';$('amount').value=a?.amount??'';$('category').value=a?.category||'Shtëpia';$('recurring').value=a?(a.templateId?'yes':'no'):'yes';$('delete').hidden=!a;$('editor').showModal()}$('add').onclick=()=>edit(null);$('cancel').onclick=()=>$('editor').close();$('items').onchange=e=>{let a=month(key()).find(v=>v.id===e.target.dataset.check);if(a){a.paid=e.target.checked;save();render()}};$('items').onclick=e=>{const b=e.target.closest('[data-edit]');if(b){let a=month(key()).find(x=>x.id===b.dataset.edit);if(a)edit(a)}};$('expenseForm').onsubmit=e=>{e.preventDefault();let name=$('name').value.trim(),amount=Number($('amount').value),category=$('category').value,rec=$('recurring').value==='yes',k=key();if(!name||!Number.isFinite(amount)||amount<0||amount>1e8)return;let arr=month(k),a=editing?arr.find(v=>v.id===editing):null;if(!a){a={id:uid(),paid:false};arr.push(a)}let old=a.templateId;Object.assign(a,{name,amount,category});if(rec){let t=old&&db.templates.find(v=>v.id===old);if(t){Object.assign(t,{name,amount,category});delete t.endAfter}else{t={id:uid(),name,amount,category,activeFrom:k};db.templates.push(t);a.templateId=t.id}}else{if(old){let t=db.templates.find(v=>v.id===old);if(t)t.endAfter=prev(k)}delete a.templateId}save();$('editor').close();render()};$('delete').onclick=()=>{let arr=month(key()),a=arr.find(v=>v.id===editing);if(!a)return;let all=a.templateId&&confirm('OK: fshi edhe nga muajt e ardhshëm.\nAnulo: vetëm këtë muaj.');if(a.templateId&&!all&&!confirm('Ta fshij vetëm këtë muaj?'))return;if(!a.templateId&&!confirm('Ta fshij pagesën?'))return;if(all){let t=db.templates.find(v=>v.id===a.templateId);if(t)t.endAfter=prev(key())}db.months[key()]=arr.filter(v=>v.id!==editing);save();$('editor').close();render()};$('copyPrevious').onclick=()=>{let arr=month(key()),old=month(prev(key())),count=0;for(let a of old){if(!arr.some(v=>v.name.toLowerCase()===a.name.toLowerCase())){arr.push({id:uid(),name:a.name,amount:a.amount,category:a.category,paid:false});count++}}save();render();alert(count+' pagesa u kopjuan.')};$('export').onclick=()=>{let u=URL.createObjectURL(new Blob([JSON.stringify({version:1,data:db},null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='shpenzimet-backup-'+key()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text()).data;if(!d||!Array.isArray(d.templates)||!d.months)throw Error();if(confirm('Kjo zëvendëson të gjitha të dhënat. Vazhdo?')){db=d;save();render();alert('Kopja u rikthye')}}catch{alert('Skedari nuk është i vlefshëm')}e.target.value=''};render();})();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
